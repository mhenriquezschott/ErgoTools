[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "ergotools"
version = "0.1.0.dev0"
description = "Incremental modernization of the integrated ErgoTools application"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = []

[project.scripts]
ergotools = "ergotools.launcher:main"

[project.optional-dependencies]
desktop = [
  "pulp==3.2.2; sys_platform == 'linux'",
  "highspy==1.11.0; sys_platform == 'linux'",
  "PyQt5==5.15.11; sys_platform == 'linux'",
  "PyQt5-Qt5==5.15.17; sys_platform == 'linux'",
  "PyQt5-sip==12.17.0; sys_platform == 'linux'",
  "vtk==9.5.0; sys_platform == 'linux'",
  "matplotlib==3.10.5; sys_platform == 'linux'",
  "numpy==2.2.6; sys_platform == 'linux'",
  "contourpy==1.3.2; sys_platform == 'linux'",
  "cycler==0.12.1; sys_platform == 'linux'",
  "fonttools==4.59.0; sys_platform == 'linux'",
  "kiwisolver==1.4.8; sys_platform == 'linux'",
  "pillow==11.3.0; sys_platform == 'linux'",
  "pyparsing==3.2.3; sys_platform == 'linux'",
  "python-dateutil==2.9.0.post0; sys_platform == 'linux'",
  "six==1.17.0; sys_platform == 'linux'",
  "packaging==26.3; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
  "hatchling==1.32.4",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ergotools"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/tools", "/docs", "/README.md", "/LICENSE.txt", "/pyproject.toml", "/uv.lock", "/.python-version", "/typings", "/test_projects"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "D", "UP", "B", "SIM", "RUF", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tools"]
mypy_path = "typings"
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["ergotools", "tools"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:", "class .*\\(Protocol\\):"]

[tool.ruff.lint.per-file-ignores]
# External PuLP spellings in the reviewed minimal third-party API declaration.
"typings/pulp/__init__.pyi" = ["N801", "N802", "N803"]
