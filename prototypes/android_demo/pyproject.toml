[project]
name = "ergotools-android-demo"
version = "0.1.0"
description = "Isolated offline Android assessment compatibility test"
requires-python = ">=3.13,<3.14"
dependencies = ["flet==1.1.2"]

[dependency-groups]
dev = ["flet-cli==1.1.2", "flet-desktop==1.1.2"]

[tool.flet]
org = "org.ergotools"
product = "ErgoTools Tablet Test"
company = "ErgoTools"
# Stable prototype-only identity: updates retain its private test data.
bundle_id = "org.ergotools.tabletdemo"

[tool.flet.app]
path = "src"

[tool.flet.android]
target_arch = ["x86_64"]
